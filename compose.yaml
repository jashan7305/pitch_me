services:
  pitchme:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: pitchme

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - ./.env

    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data

    restart: unless-stopped